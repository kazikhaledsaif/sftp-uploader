# Homelab deployment: Rails app + aria2, no Redis/Sidekiq needed.
#
#   cp .env.example .env   # then fill in AUTH_*, SECRET_KEY_BASE, ARIA2_RPC_SECRET, MEDIA_ROOT
#   docker compose up -d --build
#
# MEDIA_ROOT is the folder on this machine that holds your media folders (Movies/, TV/, Downloads/...).
# It is mounted as /data, so any folder listed in DOWNLOAD_DESTINATIONS just works.
# All containers show up under one "sftp-downloader" group in Docker.
name: sftp-downloader

services:
  web:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      RAILS_ENV: production
      DOWNLOAD_ENGINE: aria2
      ARIA2_RPC_URL: http://aria2:6800/jsonrpc
      DATABASE_PATH: /app/storage/production.sqlite3
      WEB_CONCURRENCY: "0"      # single Puma process: saves RAM
      RAILS_MAX_THREADS: "5"
    ports:
      - "${APP_PORT:-3000}:3000"
    volumes:
      - app_storage:/app/storage
      - ${MEDIA_ROOT:?Set MEDIA_ROOT in .env}:/data
    depends_on:
      - aria2
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/up"]
      interval: 30s
      timeout: 5s
      retries: 3

  aria2:
    build: ./docker/aria2
    restart: unless-stopped
    environment:
      ARIA2_RPC_SECRET: ${ARIA2_RPC_SECRET:?Set ARIA2_RPC_SECRET in .env}
      ARIA2_CONNECTIONS: ${ARIA2_CONNECTIONS:-16}
      ARIA2_MAX_CONCURRENT: ${ARIA2_MAX_CONCURRENT:-5}
      ARIA2_SPEED_LIMIT: ${ARIA2_SPEED_LIMIT:-0}
      ARIA2_DISK_CACHE: ${ARIA2_DISK_CACHE:-64M}
      ARIA2_FILE_ALLOCATION: ${ARIA2_FILE_ALLOCATION:-falloc}
    # No "ports:" on purpose: only the web container can talk to aria2.
    volumes:
      - aria2_session:/session
      - ${MEDIA_ROOT}:/data

volumes:
  app_storage:
  aria2_session:
